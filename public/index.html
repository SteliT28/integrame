<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Integrame</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><h1>Creator Integrame</h1><p>Construiește manual. Verifică. Printează.</p></div><div class="tabs"><button class="active" data-mode="creator">Creator</button><button data-mode="reader">Previzualizare</button></div></header>
<main><aside id="panel"><h2>Instrumente</h2><label>Titlu<input id="title" value="Integramă fără titlu"></label><div class="row"><label>Rânduri<input id="rows" type="number" min="5" max="30" value="12"></label><label>Coloane<input id="cols" type="number" min="5" max="30" value="12"></label></div><button id="resize">Redimensionează</button><hr><h3>Celulă selectată</h3><div id="emptyState">Selectează o celulă din grilă.</div><div id="editor" hidden><label>Tip<select id="cellType"><option value="letter">Literă</option><option value="clue">Indiciu</option><option value="block">Blocată</option><option value="empty">Goală</option></select></label><div id="letterFields"><label>Literă<input id="letter" maxlength="1" placeholder="A"></label></div><div id="clueFields" hidden><label>Număr indicii<select id="clueCount"><option>1</option><option>2</option><option>3</option></select></label><div id="clues"></div></div><button id="apply">Aplică</button></div><hr><h3>Adaugă un răspuns</h3><label>Răspuns<input id="answer" placeholder="BUCUREȘTI"></label><label>Definiție<input id="definition" placeholder="Capitala României"></label><label>Direcție<select id="direction"><option value="R">→ dreapta</option><option value="D">↓ jos</option><option value="L">← stânga</option><option value="U">↑ sus</option></select></label><p class="hint">Selectează celula de indiciu, apoi apasă butonul.</p><button id="place">Adaugă din celula selectată</button><div id="message"></div><hr><button id="check">Verifică grila</button><button id="print">Printează / Salvează PDF</button></aside><section class="workspace"><div class="paper"><h2 id="paperTitle">Integramă fără titlu</h2><div id="grid"></div><div id="summary"></div></div></section></main><script src="/app.js"></script></body></html>
